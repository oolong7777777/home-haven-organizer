services:
  - type: web
    name: home-haven-organizer
    runtime: node
    plan: free
    buildCommand: npm ci --prefix server && npm ci --prefix client && npm run build --prefix client
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /tmp/home-haven.sqlite
      - key: BASIC_AUTH_USER
        value: haven
      - key: BASIC_AUTH_PASSWORD
        generateValue: true
